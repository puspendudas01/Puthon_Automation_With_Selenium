[pytest]
testpaths = tests
addopts = -v --html=reports/execution_report.html --self-contained-html --junitxml=reports/junit_results.xml
log_file = reports/execution.log
log_file_level = INFO
log_file_format = %(asctime)s | %(levelname)-7s | %(name)s | %(message)s
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-7s | %(message)s
markers =
    e2e: end-to-end purchase flow
